<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>설화 RPG</title>
  <meta name="theme-color" content="#1d1a14">
  <!-- 아이폰 홈 화면에 추가했을 때 앱처럼 열리도록 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="설화 RPG">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="game"></div>

  <!-- 왼쪽 가상 조이스틱 (src/ui/joystick.js) -->
  <div id="joystick-zone">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
  </div>

  <!-- 오른쪽 위 버튼: 소리, 귀환, 무예(무예창), 가방(장비창), 격자, 관리자 (src/ui/hud.js) -->
  <div id="hud">
    <button id="btn-sound" type="button" aria-label="소리">소리 켬</button>
    <button id="btn-recall" type="button" aria-label="귀환"><img src="assets/items/icons/item_return_charm.png" alt="" draggable="false"><span>귀환</span></button>
    <button id="btn-skills" type="button">무예</button>
    <button id="btn-bag" type="button">가방</button>
    <button id="btn-grid" type="button">격자</button>
    <button id="btn-admin" type="button" hidden>관리자</button>
  </div>
  <div id="fps"></div>

  <!-- 왼쪽 위 레벨·체력·경험치·엽전 (src/ui/statusPanel.js) -->
  <div id="status">
    <div class="st-top"><span class="st-level">Lv 1</span><span class="st-coins"><img src="assets/items/icons/coins.png" alt="" draggable="false"><span class="st-coins-text">0푼</span></span></div>
    <div class="st-hp"><div class="st-hp-fill"></div><span class="st-hp-text"></span></div>
    <div class="st-exp"><div class="st-exp-fill"></div></div>
    <div class="st-boost" hidden></div>
  </div>

  <!-- 오른쪽 아래 공격 버튼 (src/ui/attackButton.js, PC는 스페이스) -->
  <button id="btn-attack" type="button" aria-label="공격">공격</button>
  <!-- 공격 버튼 둘레 무예 칸 4개 (src/ui/skillButtons.js, PC는 1·2·3·4) -->
  <div id="skill-buttons"></div>

  <!-- 사람(NPC) 창: 사기·팔기·무예 배우기·대화 (src/ui/npcPanel.js) -->
  <div id="npc-panel" class="panel" hidden></div>

  <!-- 레벨업 연출: 가장자리 어둡게·가운데 붓글씨·금빛 물결 (src/scenes/levelUpFx.js) -->
  <div id="vignette"></div>
  <div id="gold-wave"></div>
  <div id="levelup-banner">
    <div class="lb-title">레벨 업</div>
    <div class="lb-level"></div>
    <div class="lb-hp"></div>
  </div>

  <!-- 아이템 정보창(가방·장비·가게에서 아이콘을 누르면) + PC 마우스 올리면 작은 창 (src/ui/itemInfo.js) -->
  <div id="item-info" hidden><div class="ii-box"></div></div>
  <div id="item-tip" hidden></div>

  <!-- 무예창: 무예 칸 4개에 넣고 빼기 (src/ui/skillPanel.js, docs/spec/skills_impact.md 2) -->
  <div id="skill-panel" hidden></div>

  <!-- 관리자 창: 나·물건·맵·설정 (src/ui/adminPanel.js, docs/spec/admin_mode.md) -->
  <div id="admin-panel" hidden></div>

  <!-- 잠깐 뜨는 알림 (src/ui/toast.js) -->
  <div id="toast"></div>

  <!-- 격자 편집 도구 (src/ui/editorPanel.js) -->
  <div id="editor-panel" hidden>
    <div class="editor-title">격자 편집</div>
    <div class="editor-help">드래그로 칠하기. 빨간 칸에서 시작하면 지우고, 빈 칸에서 시작하면 막습니다.</div>
    <button id="ed-brush" type="button">붓 1칸</button>
    <button id="ed-export" type="button">파일로 내보내기</button>
    <button id="ed-reset" type="button">원래대로</button>
    <button id="ed-close" type="button">닫기</button>
  </div>

  <!-- 장비창·가방 (src/ui/equipmentPanel.js) -->
  <div id="equip-panel" class="panel" hidden>
    <div class="equip-head">
      <div class="equip-title">장비</div>
      <button class="equip-close" type="button">닫기</button>
    </div>
    <div class="equip-totals"></div>
    <div class="equip-slots"></div>
    <div class="equip-title">가방</div>
    <div class="equip-bag"></div>
    <div class="equip-info"></div>
  </div>

  <div id="rotate">
    <div class="rotate-icon">⟳</div>
    <div>화면을 가로로 돌려 주세요</div>
  </div>
  <div id="loading">불러오는 중…</div>

  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
